<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ site.title }}</title>
<meta name="description" content="{{ site.description }}">
<style>
  @font-face { font-family: "Register"; src: url("{{ '/fontes/Register-Regular.otf' | relative_url }}") format("opentype"); font-weight: normal; font-style: normal; font-display: swap; }
  body { background: #FFFFFF; color: #000000; font-family: "Times New Roman", Times, serif; font-size: 18px; line-height: 1.5; padding: 16px; max-width: 36em; margin: 0 auto; }
  h1, h2 { font-family: "Register", "Times New Roman", Times, serif; font-weight: normal; }
  h1 { margin-bottom: 0; }
  h1 + p { margin-top: 0.2em; }
  a { color: #0000EE; }
  a:visited { color: #551A8B; }
</style>
</head>
<body>
{{ content }}
</body>
</html>
